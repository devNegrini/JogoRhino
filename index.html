<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Rhino</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --orange: #ff6b1a;
        --orange2: #ff8c42;
        --yellow: #ffd700;
        --purple: #5b2d8e;
        --purple2: #7c3fbf;
        --outline: #3b1a60;
        --white: #fff8f0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Nunito", sans-serif;
        background: #1a0a30;
      }

      /* BG */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 60%,
          #ff8c42 0%,
          #ff6b1a 40%,
          #c73d00 70%,
          #3b1a60 100%
        );
      }
      #bg-sun {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 200vmax;
        height: 200vmax;
        transform: translate(-50%, -50%);
        background: conic-gradient(
          #ffd700 0deg,
          #ff8c42 10deg,
          #ffd700 20deg,
          #ff8c42 30deg,
          #ffd700 40deg,
          #ff8c42 50deg,
          #ffd700 60deg,
          #ff8c42 70deg,
          #ffd700 80deg,
          #ff8c42 90deg,
          #ffd700 100deg,
          #ff8c42 110deg,
          #ffd700 120deg,
          #ff8c42 130deg,
          #ffd700 140deg,
          #ff8c42 150deg,
          #ffd700 160deg,
          #ff8c42 170deg,
          #ffd700 180deg,
          #ff8c42 190deg,
          #ffd700 200deg,
          #ff8c42 210deg,
          #ffd700 220deg,
          #ff8c42 230deg,
          #ffd700 240deg,
          #ff8c42 250deg,
          #ffd700 260deg,
          #ff8c42 270deg,
          #ffd700 280deg,
          #ff8c42 290deg,
          #ffd700 300deg,
          #ff8c42 310deg,
          #ffd700 320deg,
          #ff8c42 330deg,
          #ffd700 340deg,
          #ff8c42 350deg,
          #ffd700 360deg
        );
        opacity: 0.22;
        animation: spinSun 22s linear infinite;
      }
      @keyframes spinSun {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
      #bg-overlay {
        position: absolute;
        inset: 0;
        background: rgba(59, 26, 96, 0.55);
      }

      /* SCREENS */
      .screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.4s,
          transform 0.4s;
      }
      .screen.hidden {
        opacity: 0;
        pointer-events: none;
        transform: scale(0.94);
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.7) rotate(-3deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }

      /* LOGIN */
      #loginScreen {
        flex-direction: column;
      }
      .login-card {
        position: relative;
        background: var(--white);
        border: 5px solid var(--outline);
        border-radius: 28px;
        padding: 28px 40px 36px;
        width: 320px;
        box-shadow: 7px 9px 0 var(--outline);
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .login-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: repeating-linear-gradient(
          90deg,
          var(--orange) 0,
          var(--orange) 20px,
          var(--yellow) 20px,
          var(--yellow) 40px
        );
        border-radius: 22px 22px 0 0;
      }
      .logo-img {
        width: 220px;
        margin: 4px 0 20px;
        filter: drop-shadow(3px 4px 0 var(--outline));
        animation: rhinoBob 2s ease-in-out infinite;
      }
      @keyframes rhinoBob {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-8px) rotate(2deg);
        }
      }
      .btn-play {
        width: 100%;
        padding: 14px;
        background: var(--yellow);
        border: 3px solid var(--outline);
        border-radius: 14px;
        font-family: "Lilita One", cursive;
        font-size: 22px;
        color: var(--outline);
        cursor: pointer;
        box-shadow: 4px 5px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
        margin-bottom: 8px;
      }
      .btn-play:hover {
        background: #ffe84d;
        transform: translate(-1px, -1px);
        box-shadow: 5px 6px 0 var(--outline);
      }
      .btn-play:active {
        transform: translate(3px, 4px);
        box-shadow: 1px 1px 0 var(--outline);
      }
      .btn-shop-login {
        width: 100%;
        padding: 11px;
        background: var(--purple2);
        border: 3px solid var(--outline);
        border-radius: 14px;
        font-family: "Lilita One", cursive;
        font-size: 16px;
        color: #fff;
        cursor: pointer;
        box-shadow: 4px 5px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .btn-shop-login:hover {
        background: #9150d4;
        transform: translate(-1px, -1px);
        box-shadow: 5px 6px 0 var(--outline);
      }
      .btn-shop-login:active {
        transform: translate(3px, 4px);
        box-shadow: 1px 1px 0 var(--outline);
      }

      /* GAME */
      #gameScreen {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #topBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 420px;
        background: var(--white);
        border: 3px solid var(--outline);
        border-radius: 14px;
        padding: 7px 14px;
        box-shadow: 4px 4px 0 var(--outline);
      }
      #muteBtn {
        background: var(--yellow);
        border: 2.5px solid var(--outline);
        border-radius: 8px;
        font-size: 16px;
        width: 34px;
        height: 34px;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--outline);
        transition: transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #muteBtn:hover {
        transform: translate(-1px, -1px);
      }
      #coinDisplay {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: "Lilita One", cursive;
        font-size: 14px;
        color: var(--outline);
        background: var(--yellow);
        border: 2.5px solid var(--outline);
        border-radius: 10px;
        padding: 3px 9px;
        box-shadow: 2px 2px 0 var(--outline);
      }
      #scoreDisplay {
        font-family: "Lilita One", cursive;
        font-size: 26px;
        color: var(--orange);
        -webkit-text-stroke: 1.5px var(--outline);
        text-shadow: 2px 2px 0 var(--outline);
      }
      #levelBadge {
        font-size: 10px;
        font-weight: 900;
        color: var(--white);
        background: var(--orange);
        border: 2px solid var(--outline);
        border-radius: 6px;
        padding: 2px 7px;
        font-family: "Lilita One", cursive;
        display: none;
      }
      #bestDisplay {
        font-size: 11px;
        font-weight: 900;
        color: var(--purple2);
      }
      #logoutBtn {
        background: var(--purple2);
        border: 2px solid var(--outline);
        border-radius: 8px;
        color: #fff;
        font-family: "Nunito", sans-serif;
        font-size: 11px;
        font-weight: 900;
        padding: 4px 10px;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--outline);
      }
      #gameCanvas {
        border-radius: 14px;
        border: 4px solid var(--outline);
        box-shadow: 6px 8px 0 var(--outline);
        display: block;
        cursor: pointer;
      }
      #hint {
        font-size: 12px;
        font-weight: 900;
        color: var(--white);
        opacity: 0.7;
      }
      @keyframes coinFlash {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(1);
        }
      }
      .coin-flash {
        animation: coinFlash 0.22s ease;
      }
      .coin-pop {
        position: fixed;
        font-family: "Lilita One", cursive;
        font-size: 18px;
        color: var(--yellow);
        -webkit-text-stroke: 1.5px var(--outline);
        pointer-events: none;
        z-index: 99;
        animation: coinPopAnim 0.8s ease-out forwards;
      }
      @keyframes coinPopAnim {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-50px) scale(1.3);
        }
      }

      /* NAME MODAL */
      #nameModal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30, 10, 60, 0.75);
        backdrop-filter: blur(4px);
        transition: opacity 0.3s;
      }
      #nameModal.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .name-card {
        position: relative;
        background: var(--white);
        border: 5px solid var(--outline);
        border-radius: 24px;
        padding: 28px 36px 30px;
        width: 320px;
        text-align: center;
        box-shadow: 7px 9px 0 var(--outline);
        animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .name-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: repeating-linear-gradient(
          90deg,
          var(--orange) 0,
          var(--orange) 20px,
          var(--yellow) 20px,
          var(--yellow) 40px
        );
        border-radius: 18px 18px 0 0;
      }
      .name-title {
        font-family: "Lilita One", cursive;
        font-size: 22px;
        color: var(--orange);
        -webkit-text-stroke: 1.5px var(--outline);
        text-shadow: 2px 2px 0 var(--outline);
      }
      .name-score-display {
        font-family: "Lilita One", cursive;
        font-size: 32px;
        color: var(--purple2);
        -webkit-text-stroke: 1.5px var(--outline);
        text-shadow: 2px 2px 0 var(--outline);
      }
      .name-sub {
        font-size: 13px;
        font-weight: 800;
        color: #888;
      }
      .name-input {
        width: 100%;
        background: #fff;
        border: 3px solid var(--outline);
        border-radius: 12px;
        padding: 11px 14px;
        font-size: 16px;
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        color: var(--outline);
        outline: none;
        box-shadow: 3px 3px 0 var(--outline);
      }
      .name-input:focus {
        border-color: var(--orange);
      }
      .name-input::placeholder {
        color: #ccc;
        font-weight: 700;
      }
      .name-error {
        font-size: 13px;
        font-weight: 900;
        color: #d63030;
        display: none;
      }
      .name-error.show {
        display: block;
      }
      .btn-save-name {
        width: 100%;
        padding: 13px;
        background: var(--yellow);
        border: 3px solid var(--outline);
        border-radius: 12px;
        font-family: "Lilita One", cursive;
        font-size: 17px;
        color: var(--outline);
        cursor: pointer;
        box-shadow: 4px 5px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .btn-save-name:hover {
        background: #ffe84d;
        transform: translate(-1px, -1px);
        box-shadow: 5px 6px 0 var(--outline);
      }
      .btn-save-name:active {
        transform: translate(3px, 4px);
        box-shadow: 1px 1px 0 var(--outline);
      }
      .btn-save-name:disabled {
        background: #aaa;
        cursor: not-allowed;
        transform: none;
      }
      .name-modal-actions {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      .btn-modal-action {
        flex: 1;
        padding: 11px;
        border: 3px solid var(--outline);
        border-radius: 12px;
        font-family: "Lilita One", cursive;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 3px 4px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
        color: #fff;
      }
      .btn-modal-action:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 5px 0 var(--outline);
      }
      .btn-modal-action:active {
        transform: translate(2px, 3px);
        box-shadow: 1px 1px 0 var(--outline);
      }

      /* RANKING */
      #rankingScreen {
        flex-direction: column;
        align-items: center;
      }
      .rank-card {
        position: relative;
        background: var(--white);
        border: 5px solid var(--outline);
        border-radius: 28px;
        padding: 28px 36px 32px;
        width: 360px;
        box-shadow: 7px 9px 0 var(--outline);
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .rank-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: repeating-linear-gradient(
          90deg,
          var(--yellow) 0,
          var(--yellow) 20px,
          var(--orange) 20px,
          var(--orange) 40px
        );
        border-radius: 22px 22px 0 0;
      }
      .rank-title {
        font-family: "Lilita One", cursive;
        font-size: 30px;
        text-align: center;
        color: var(--orange);
        -webkit-text-stroke: 2px var(--outline);
        text-shadow: 3px 3px 0 var(--outline);
        margin-bottom: 20px;
        margin-top: 4px;
      }
      .rank-list {
        list-style: none;
        width: 100%;
        margin-bottom: 20px;
      }
      .rank-list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        margin-bottom: 8px;
        background: #fff;
        border: 3px solid var(--outline);
        border-radius: 12px;
        box-shadow: 2px 3px 0 var(--outline);
        font-family: "Lilita One", cursive;
        font-size: 15px;
        color: var(--outline);
      }
      .rank-list li:first-child {
        background: var(--yellow);
        font-size: 17px;
      }
      .rank-list li:nth-child(2) {
        background: #e8e8e8;
      }
      .rank-list li:nth-child(3) {
        background: #f4c98a;
      }
      .rank-pos {
        font-size: 20px;
        width: 28px;
        text-align: center;
      }
      .rank-pname {
        flex: 1;
      }
      .rank-pts {
        color: var(--purple2);
        font-size: 14px;
      }
      .rank-btns {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      .btn-rank {
        flex: 1;
        padding: 12px;
        background: var(--yellow);
        border: 3px solid var(--outline);
        border-radius: 12px;
        font-family: "Lilita One", cursive;
        font-size: 17px;
        color: var(--outline);
        cursor: pointer;
        box-shadow: 3px 4px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .btn-rank:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 5px 0 var(--outline);
      }
      .btn-rank:active {
        transform: translate(2px, 3px);
        box-shadow: 1px 1px 0 var(--outline);
      }
      .btn-rank.purple {
        background: var(--purple2);
        color: #fff;
      }

      /* SHARE MODAL */
      #shareModal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30, 10, 60, 0.72);
        backdrop-filter: blur(4px);
        transition: opacity 0.3s;
      }
      #shareModal.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .share-card {
        background: var(--white);
        border: 5px solid var(--outline);
        border-radius: 24px;
        padding: 28px 36px 30px;
        width: 310px;
        text-align: center;
        box-shadow: 7px 9px 0 var(--outline);
        animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .share-title {
        font-family: "Lilita One", cursive;
        font-size: 24px;
        color: var(--orange);
        -webkit-text-stroke: 1.5px var(--outline);
        text-shadow: 2px 2px 0 var(--outline);
        margin-bottom: 4px;
      }
      .share-score {
        font-family: "Lilita One", cursive;
        font-size: 17px;
        color: var(--purple2);
        margin-bottom: 18px;
      }
      .share-btns {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn-share {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 18px;
        border: 3px solid var(--outline);
        border-radius: 12px;
        font-family: "Lilita One", cursive;
        font-size: 17px;
        cursor: pointer;
        box-shadow: 3px 4px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
        color: #fff;
      }
      .btn-share:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 5px 0 var(--outline);
      }
      .btn-wpp {
        background: #25d366;
      }
      .btn-ig {
        background: linear-gradient(
          135deg,
          #f09433,
          #e6683c,
          #dc2743,
          #cc2366,
          #bc1888
        );
      }
      .btn-tt {
        background: #010101;
      }
      .btn-close-share {
        background: #888;
      }

      /* SHOP */
      #shopScreen {
        flex-direction: column;
        align-items: center;
      }
      .shop-card {
        position: relative;
        background: var(--white);
        border: 5px solid var(--outline);
        border-radius: 24px;
        width: 430px;
        max-height: 94vh;
        box-shadow: 7px 9px 0 var(--outline);
        display: flex;
        flex-direction: column;
        animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        overflow: hidden;
      }
      .shop-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: repeating-linear-gradient(
          90deg,
          var(--orange) 0,
          var(--orange) 18px,
          var(--yellow) 18px,
          var(--yellow) 36px
        );
        border-radius: 20px 20px 0 0;
        z-index: 2;
      }
      .shop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 8px;
        margin-top: 6px;
        flex-shrink: 0;
      }
      .shop-title {
        font-family: "Lilita One", cursive;
        font-size: 24px;
        color: var(--orange);
        -webkit-text-stroke: 1.5px var(--outline);
        text-shadow: 2px 2px 0 var(--outline);
      }
      .shop-coins {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--yellow);
        border: 2.5px solid var(--outline);
        border-radius: 10px;
        padding: 4px 12px;
        font-family: "Lilita One", cursive;
        font-size: 15px;
        color: var(--outline);
        box-shadow: 2px 2px 0 var(--outline);
      }
      .shop-preview-panel {
        margin: 0 14px 10px;
        background: linear-gradient(135deg, #f0e8ff, #ffe8f0);
        border: 3px solid var(--outline);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
        box-shadow: 2px 3px 0 var(--outline);
        min-height: 88px;
      }
      #previewCanvas {
        border-radius: 10px;
        border: 2.5px solid var(--outline);
        flex-shrink: 0;
      }
      .preview-info {
        flex: 1;
        min-width: 0;
      }
      .preview-item-name {
        font-family: "Lilita One", cursive;
        font-size: 17px;
        color: var(--outline);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview-item-desc {
        font-size: 12px;
        font-weight: 800;
        color: #888;
        margin-top: 2px;
      }
      .preview-item-price {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        background: var(--yellow);
        border: 2px solid var(--outline);
        border-radius: 8px;
        padding: 2px 10px;
        font-family: "Lilita One", cursive;
        font-size: 13px;
        color: var(--outline);
      }
      .preview-item-price.free {
        background: #e8f5e8;
        color: #3aaa3a;
      }
      .preview-item-price.owned {
        background: #e8f5e8;
        color: #3aaa3a;
      }
      .btn-equip {
        margin-top: 8px;
        padding: 7px 14px;
        background: var(--orange);
        border: 2.5px solid var(--outline);
        border-radius: 10px;
        font-family: "Lilita One", cursive;
        font-size: 13px;
        color: #fff;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
        display: block;
        width: 100%;
      }
      .btn-equip:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--outline);
      }
      .btn-equip.buy {
        background: var(--purple2);
      }
      .btn-equip.equipped-state {
        background: #3aaa3a;
      }
      .btn-equip:disabled {
        background: #aaa;
        cursor: not-allowed;
        transform: none;
      }
      .shop-tabs {
        display: flex;
        gap: 6px;
        padding: 0 14px 8px;
        flex-shrink: 0;
      }
      .shop-tab {
        flex: 1;
        padding: 8px 4px;
        background: #eee;
        border: 2.5px solid var(--outline);
        border-radius: 10px;
        font-family: "Lilita One", cursive;
        font-size: 12px;
        color: var(--outline);
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--outline);
        transition: all 0.15s;
        text-align: center;
      }
      .shop-tab.active {
        background: var(--orange);
        color: #fff;
      }
      .shop-tab:hover:not(.active) {
        background: var(--yellow);
      }
      .shop-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 0 14px 10px;
        overflow-y: auto;
        flex: 1;
      }
      .shop-item {
        position: relative;
        background: #fff;
        border: 3px solid var(--outline);
        border-radius: 12px;
        padding: 8px 4px 7px;
        text-align: center;
        box-shadow: 2px 3px 0 var(--outline);
        cursor: pointer;
        transition:
          transform 0.12s,
          box-shadow 0.12s,
          border-color 0.15s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .shop-item:hover {
        transform: translate(-1px, -2px);
        box-shadow: 3px 5px 0 var(--outline);
      }
      .shop-item.selected {
        border-color: var(--orange);
        background: #fff8ee;
        transform: translate(-1px, -2px);
        box-shadow: 3px 5px 0 var(--orange);
      }
      .shop-item.equipped-item {
        border-color: #3aaa3a;
        background: #edfaed;
      }
      .shop-item.locked-item {
        opacity: 0.65;
      }
      .shop-item-preview {
        width: 62px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        overflow: hidden;
      }
      .shop-item-name {
        font-family: "Lilita One", cursive;
        font-size: 11px;
        color: var(--outline);
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .shop-item-price {
        font-family: "Lilita One", cursive;
        font-size: 12px;
        color: var(--outline);
      }
      .shop-item-price.free-tag {
        color: #3aaa3a;
        font-size: 10px;
      }
      .shop-badge {
        position: absolute;
        top: -7px;
        right: -5px;
        border: 2px solid var(--outline);
        border-radius: 20px;
        padding: 1px 6px;
        font-family: "Lilita One", cursive;
        font-size: 9px;
        pointer-events: none;
      }
      .shop-badge.b-equipped {
        background: var(--orange);
        color: #fff;
      }
      .shop-badge.b-owned {
        background: #3aaa3a;
        color: #fff;
      }
      .shop-badge.b-locked {
        background: #888;
        color: #fff;
      }
      .shop-footer {
        padding: 8px 14px 14px;
        flex-shrink: 0;
      }
      .btn-shop-close {
        width: 100%;
        padding: 12px;
        background: var(--purple2);
        border: 3px solid var(--outline);
        border-radius: 12px;
        font-family: "Lilita One", cursive;
        font-size: 16px;
        color: #fff;
        cursor: pointer;
        box-shadow: 3px 4px 0 var(--outline);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .btn-shop-close:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 5px 0 var(--outline);
      }
      #shopToast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--outline);
        color: var(--yellow);
        font-family: "Lilita One", cursive;
        font-size: 16px;
        padding: 10px 24px;
        border-radius: 30px;
        z-index: 200;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.35s;
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
      }
      #shopToast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="bg">
      <div id="bg-sun"></div>
      <div id="bg-overlay"></div>
    </div>

    <!-- LOGIN -->
    <div class="screen" id="loginScreen">
      <div class="login-card">
        <img id="logoImg" class="logo-img" alt="Flappy Rhino" />
        <button class="btn-play" id="loginBtn">🚀 Jogar!</button>
        <button class="btn-shop-login" id="shopBtnLogin">
          🛒 Loja de Itens
        </button>
      </div>
    </div>

    <!-- GAME -->
    <div class="screen hidden" id="gameScreen">
      <div id="topBar">
        <button id="muteBtn">🔊</button>
        <div id="coinDisplay"><span>🪙</span><span id="coinCount">0</span></div>
        <div style="display: flex; align-items: center; gap: 6px">
          <div id="scoreDisplay">0</div>
          <div id="levelBadge">LV1</div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center">
          <div id="bestDisplay">🏆 0</div>
          <button id="logoutBtn">Sair</button>
        </div>
      </div>
      <canvas id="gameCanvas" width="420" height="520"></canvas>
      <p id="hint">Espaço ou clique para pular!</p>
    </div>

    <!-- RANKING -->
    <div class="screen hidden" id="rankingScreen">
      <div class="rank-card">
        <h2 class="rank-title">🏆 Ranking</h2>
        <ul class="rank-list" id="rankList"></ul>
        <div class="rank-btns">
          <button class="btn-rank purple" id="btnBackToGame">▶ Jogar</button>
          <button class="btn-rank" id="btnShare2">📤 Compartilhar</button>
        </div>
      </div>
    </div>

    <!-- SHARE MODAL -->
    <div id="shareModal" class="hidden">
      <div class="share-card">
        <div class="share-title">📤 Compartilhar!</div>
        <div class="share-score" id="shareScoreText"></div>
        <div class="share-btns">
          <button class="btn-share btn-wpp" id="btnWpp">💬 WhatsApp</button>
          <button class="btn-share btn-ig" id="btnIg">📸 Instagram</button>
          <button class="btn-share btn-tt" id="btnTt">🎵 TikTok</button>
          <button class="btn-share btn-close-share" id="btnCloseShare">
            ✕ Fechar
          </button>
        </div>
      </div>
    </div>

    <!-- NAME MODAL -->
    <div id="nameModal" class="hidden">
      <div class="name-card">
        <div class="name-title">🎮 Game Over!</div>
        <div class="name-score-display" id="nameModalScore">0 pts</div>
        <p class="name-sub" id="nameModalSub">Coloque seu nome no ranking!</p>
        <input
          type="text"
          class="name-input"
          id="nameInput"
          placeholder="Seu apelido"
          maxlength="16"
          autocomplete="off"
        />
        <div class="name-error" id="nameError">Ei! Preciso do seu nome! 👀</div>
        <button class="btn-save-name" id="btnSaveName">
          ✅ Salvar no Ranking
        </button>
        <div class="name-modal-actions">
          <button
            class="btn-modal-action"
            id="btnNameRanking"
            style="background: var(--purple2)"
          >
            🏆 Ranking
          </button>
          <button
            class="btn-modal-action"
            id="btnNameReplay"
            style="background: var(--orange)"
          >
            🔄 Jogar
          </button>
        </div>
      </div>
    </div>

    <!-- SHOP -->
    <div class="screen hidden" id="shopScreen">
      <div class="shop-card">
        <div class="shop-header">
          <div class="shop-title">🛒 Loja</div>
          <div class="shop-coins">🪙 <span id="shopCoinCount">0</span></div>
        </div>
        <div class="shop-preview-panel">
          <canvas id="previewCanvas" width="80" height="80"></canvas>
          <div class="preview-info">
            <div class="preview-item-name" id="previewName">
              Selecione um item
            </div>
            <div class="preview-item-desc" id="previewDesc">
              Toque para ver detalhes
            </div>
            <div class="preview-item-price free" id="previewPrice"></div>
            <button class="btn-equip" id="btnEquipItem" style="display: none">
              Equipar
            </button>
          </div>
        </div>
        <div class="shop-tabs">
          <button class="shop-tab active" data-tab="pipes">🟧 Canos</button>
          <button class="shop-tab" data-tab="bgs">🌅 Fundo</button>
        </div>
        <div class="shop-grid" id="shopGrid"></div>
        <div class="shop-footer">
          <button class="btn-shop-close" id="btnShopClose">← Voltar</button>
        </div>
      </div>
    </div>
    <div id="shopToast"></div>

      // ══════════════════════════════════════════════
      // SCREENS
      // ══════════════════════════════════════════════
      const loginScreen = document.getElementById("loginScreen");
      const gameScreen = document.getElementById("gameScreen");
      const rankingScreen = document.getElementById("rankingScreen");
      const shopScreen = document.getElementById("shopScreen");
      function showScreen(s) {
        [loginScreen, gameScreen, rankingScreen, shopScreen].forEach((x) => {
          if (x) x.classList.add("hidden");
        });
        s.classList.remove("hidden");
      }

      // ══════════════════════════════════════════════
      // RANKING
      // ══════════════════════════════════════════════
      const lastSessionId =
        Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      function getRanking() {
        try {
          return JSON.parse(localStorage.getItem("flappy_ranking") || "[]");
        } catch {
          return [];
        }
      }
      function saveRanking(r) {
        localStorage.setItem("flappy_ranking", JSON.stringify(r));
      }
      function addScore(name, pts) {
        if (pts <= 0) return;
        const r = getRanking();
        const idx = r.findIndex(
          (e) => e.name.toLowerCase() === name.toLowerCase(),
        );
        if (idx !== -1) {
          if (pts > r[idx].pts) r[idx].pts = pts;
        } else {
          const dup = r.some(
            (e) => e.pts === pts && e._session === lastSessionId,
          );
          if (!dup) r.push({ name, pts, _session: lastSessionId });
        }
        r.sort((a, b) => b.pts - a.pts);
        saveRanking(r.slice(0, 10));
      }
      function renderRanking() {
        const r = getRanking();
        const ul = document.getElementById("rankList");
        const medals = ["🥇", "🥈", "🥉"];
        if (!r.length) {
          ul.innerHTML =
            '<li style="justify-content:center;font-family:Nunito;font-size:14px;color:#aaa">Nenhuma pontuação ainda!</li>';
          return;
        }
        ul.innerHTML = r
          .slice(0, 8)
          .map(
            (e, i) =>
              `<li><span class="rank-pos">${medals[i] || "#" + (i + 1)}</span><span class="rank-pname">${e.name}</span><span class="rank-pts">${e.pts} pts</span></li>`,
          )
          .join("");
      }
      // one-time cleanup
      (function () {
        try {
          const r = getRanking().filter((e) => e.pts > 0);
          saveRanking(r);
        } catch (e) {}
      })();

      // ══════════════════════════════════════════════
      // SHARE
      // ══════════════════════════════════════════════
      let lastScore = 0,
        currentPlayer = "Jogador";
      function openShare(score, name) {
        const text = encodeURIComponent(
          "Fiz " + score + " pontos no Flappy Rhino! Clique para jogar: https://jogorhino.vercel.app/ 🦏⚡ #FlappyRhino",
        );
        document.getElementById("shareScoreText").textContent =
          name + ": " + score + " pts 🎉";
        document.getElementById("btnWpp").onclick = () =>
          window.open("https://wa.me/?text=" + text, "_blank");
        document.getElementById("btnIg").onclick = () => {
          navigator.clipboard &&
            navigator.clipboard.writeText(decodeURIComponent(text));
          alert("Copiado! Cole no Instagram 📸");
        };
        document.getElementById("btnTt").onclick = () => {
          navigator.clipboard &&
            navigator.clipboard.writeText(decodeURIComponent(text));
          alert("Copiado! Cole no TikTok 🎵");
        };
        document.getElementById("shareModal").classList.remove("hidden");
      }
      document
        .getElementById("btnCloseShare")
        .addEventListener("click", () =>
          document.getElementById("shareModal").classList.add("hidden"),
        );
      document
        .getElementById("btnShare2")
        .addEventListener("click", () => openShare(lastScore, currentPlayer));

      // ══════════════════════════════════════════════
      // NAME MODAL
      // ══════════════════════════════════════════════
      const nameModal = document.getElementById("nameModal");
      const nameInput = document.getElementById("nameInput");
      const nameError = document.getElementById("nameError");
      const nameModalScore = document.getElementById("nameModalScore");
      const btnSaveName = document.getElementById("btnSaveName");

      function openNameModal(pts) {
        nameModalScore.textContent = pts > 0 ? pts + " pts" : "0 pts";
        const sub = document.getElementById("nameModalSub");
        nameInput.style.display = "";
        btnSaveName.disabled = false;
        nameInput.value = "";
        nameError.classList.remove("show");

        if (pts <= 0) {
          btnSaveName.textContent = "🔄 Tentar novamente";
          btnSaveName.dataset.skipSave = "1";
          if (sub) sub.textContent = "Que pena! Tente de novo!";
        } else {
          // Only show "já salvo" if user explicitly saved name this exact round
          if (savedThisRound) {
            btnSaveName.textContent = "✅ Já salvo!";
            btnSaveName.disabled = true;
            btnSaveName.dataset.skipSave = "1";
            nameInput.style.display = "none";
            if (sub) sub.textContent = "✅ Pontuação já salva!";
          } else {
            btnSaveName.textContent = "✅ Salvar no Ranking";
            btnSaveName.dataset.skipSave = "";
            nameInput.style.display = "";
            if (sub) sub.textContent = "Digite seu nome para salvar!";
          }
        }
        nameModal.classList.remove("hidden");
        setTimeout(() => {
          nameInput.focus();
          nameInput.scrollIntoView({ block: "center" });
        }, 120);
      }

      function submitName() {
        if (btnSaveName.dataset.skipSave === "1") {
          nameModal.classList.add("hidden");
          reset();
          state = "idle";
          return;
        }
        const n = nameInput.value.trim();
        if (!n) {
          nameError.classList.add("show");
          nameInput.focus();
          return;
        }
        nameError.classList.remove("show");
        currentPlayer = n;
        addScore(n, lastScore);
        savedThisRound = true; // mark as saved for this round
        nameModal.classList.add("hidden");
        showScreen(gameScreen);
        if (!rafId) rafId = requestAnimationFrame(loop);
      }
      btnSaveName.addEventListener("click", submitName);
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitName();
      });

      document
        .getElementById("btnNameRanking")
        .addEventListener("click", () => {
          // Se score > 0 e ainda não salvo, nome é obrigatório
          if (btnSaveName.dataset.skipSave !== "1") {
            const n = nameInput.value.trim();
            if (!n) {
              nameError.classList.add("show");
              nameInput.focus();
              return;
            }
            nameError.classList.remove("show");
            currentPlayer = n;
            addScore(n, lastScore);
            savedThisRound = true;
          }
          nameModal.classList.add("hidden");
          renderRanking();
          showScreen(rankingScreen);
        });
      document.getElementById("btnNameReplay").addEventListener("click", () => {
        // Se score > 0 e ainda não salvo, nome é obrigatório
        if (btnSaveName.dataset.skipSave !== "1") {

        showScreen(gameScreen);
        if (!rafId) rafId = requestAnimationFrame(loop);
      });

      // Canvas item preview drawers
      function drawCharPreview(cv, item, size) {
        const cx = cv.getContext("2d");
        cx.clearRect(0, 0, size, size);
        const g = cx.createRadialGradient(
          size / 2,
          size / 2,
          4,
          size / 2,
          size / 2,
          size / 2,
        );
        g.addColorStop(0, item.color + "55");
        g.addColorStop(1, item.color + "11");
        cx.fillStyle = g;
        cx.beginPath();
        cx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
        cx.fill();
        cx.strokeStyle = item.color;
        cx.lineWidth = 2.5;
        cx.beginPath();
        cx.arc(size / 2, size / 2, size / 2 - 3, 0, Math.PI * 2);
        cx.stroke();
        cx.font = size * 0.46 + "px serif";
        cx.textAlign = "center";
        cx.textBaseline = "middle";
        cx.fillText(item.icon, size / 2, size / 2 + 1);
      }
      function drawPipePreview(cv, item, size) {
        const cx = cv.getContext("2d");
        cx.clearRect(0, 0, size, size);
        cx.fillStyle = "#d0e8ff";
        cx.fillRect(0, 0, size, size);
        function pGrad(x, w) {
          if (item.isRainbow) {
            const rg = cx.createLinearGradient(x, 0, x + w, 0);
            rg.addColorStop(0, "#FF6B6B");
            rg.addColorStop(0.33, "#FFD93D");
            rg.addColorStop(0.66, "#6BCB77");
            rg.addColorStop(1, "#4ECDC4");
            return rg;
          }
          const gr = cx.createLinearGradient(x, 0, x + w, 0);
          gr.addColorStop(0, item.colors[0]);
          gr.addColorStop(0.4, item.colors[1]);
          gr.addColorStop(1, item.colors[2]);
          return gr;
        }
        const px = 12,
          pw = size - 24;
        cx.fillStyle = pGrad(px, pw);
        cx.beginPath();
        cx.roundRect(px, 0, pw, size / 2 - 10, [0, 0, 4, 4]);
        cx.fill();
        cx.strokeStyle = "#3B1A60";
        cx.lineWidth = 1.8;
        cx.beginPath();
        cx.roundRect(px, 0, pw, size / 2 - 10, [0, 0, 4, 4]);
        cx.stroke();
        cx.fillStyle = item.isRainbow ? pGrad(px - 4, pw + 8) : item.colors[0];
        cx.beginPath();
        cx.roundRect(px - 5, size / 2 - 20, pw + 10, 14, 4);
        cx.fill();
        cx.strokeStyle = "#3B1A60";
        cx.lineWidth = 1.8;
        cx.beginPath();
        cx.roundRect(px - 5, size / 2 - 20, pw + 10, 14, 4);
        cx.stroke();
        cx.fillStyle = pGrad(px, pw);
        cx.beginPath();
        cx.roundRect(px, size / 2 + 10, pw, size / 2 - 10, [4, 4, 0, 0]);
        cx.fill();
        cx.strokeStyle = "#3B1A60";
        cx.lineWidth = 1.8;
        cx.beginPath();
        cx.roundRect(px, size / 2 + 10, pw, size / 2 - 10, [4, 4, 0, 0]);
        cx.stroke();
        cx.fillStyle = item.isRainbow ? pGrad(px - 4, pw + 8) : item.colors[0];
        cx.beginPath();
        cx.roundRect(px - 5, size / 2 + 6, pw + 10, 14, 4);
        cx.fill();
        cx.strokeStyle = "#3B1A60";
        cx.lineWidth = 1.8;
        cx.beginPath();
        cx.roundRect(px - 5, size / 2 + 6, pw + 10, 14, 4);
        cx.stroke();
      }
      function drawBgPreview(cv, item, size) {
        const cx = cv.getContext("2d");
        const sky = cx.createLinearGradient(0, 0, 0, size * 0.7);
        sky.addColorStop(0, item.sky[0]);
        sky.addColorStop(0.55, item.sky[1]);
        sky.addColorStop(1, item.sky[2]);
        cx.fillStyle = sky;
        cx.fillRect(0, 0, size, size * 0.72);
        cx.fillStyle = item.ground;
        cx.fillRect(0, size * 0.72, size, size * 0.28);
        cx.fillStyle = item.ground + "bb";
        for (let x = 0; x < size; x += 10) {
          cx.beginPath();
          cx.arc(x + 5, size * 0.72, 5, Math.PI, 0);
          cx.fill();
        }
        if (item.isLava) {
          cx.fillStyle = "rgba(255,80,0,0.3)";
          cx.fillRect(0, size * 0.72, size, size * 0.28);
          [
            [10, size * 0.78, 5],
            [30, size * 0.82, 4],
            [55, size * 0.76, 6],
          ].forEach(([x, y, r]) => {
            const lg = cx.createRadialGradient(x, y, 1, x, y, r);
            lg.addColorStop(0, "#FFD700");
            lg.addColorStop(1, "#FF4500");
            cx.fillStyle = lg;
            cx.beginPath();
            cx.arc(x, y, r, 0, Math.PI * 2);
            cx.fill();
          });
        }
        if (item.id === "bg_space") {
          cx.fillStyle = "rgba(255,255,255,.9)";
          [
            [8, 6],
            [22, 14],
            [40, 5],
            [58, 11],
            [72, 18],
          ].forEach(([x, y]) => {
            cx.beginPath();
            cx.arc(x, y, 1, 0, Math.PI * 2);
            cx.fill();
          });
        }
        if (!item.isLava && item.id !== "bg_space") {
          cx.fillStyle = "rgba(255,240,150,0.9)";
          cx.beginPath();
          cx.arc(size * 0.82, size * 0.18, 6, 0, Math.PI * 2);
          cx.fill();
        }
        cx.fillStyle = "rgba(255,255,255,0.5)";
        [
          [10, 10, 7],
          [38, 7, 6],
        ].forEach(([x, y, r]) => {
          cx.beginPath();
          cx.arc(x, y, r, 0, Math.PI * 2);
          cx.fill();
          cx.beginPath();
          cx.arc(x + r, y - 2, r - 1, 0, Math.PI * 2);
          cx.fill();
        });
      }

      function shopItemClick(tab, id) {

          if (totalCoins < item.price) {
            showToast("🪙 Faltam " + (item.price - totalCoins) + " moedas!");

          totalCoins -= item.price;
          localStorage.setItem("flappy_coins", totalCoins);
          document.getElementById("coinCount").textContent = totalCoins;
          s.owned.push(id);
          showToast("🎉 " + item.name + " comprado!");

        saveShopState(s);
        shopState = s;
        document.getElementById("shopCoinCount").textContent = totalCoins;
        applyEquipped();
        renderShop(tab);
        requestAnimationFrame(() => {

              .querySelectorAll(".shop-item")
              .forEach((x) => x.classList.remove("selected"));

      // AUDIO ENGINE
      // ══════════════════════════════════════════════
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;
      let bgNodes = [];
      let audioEnabled = true;
      let bgStarted = false;
      const muteBtn = document.getElementById("muteBtn");
      muteBtn.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        muteBtn.textContent = audioEnabled ? "🔊" : "🔇";
        if (!audioEnabled) stopBgMusic();
        else if (state === "playing") startBgMusic();
      });
      function getAudioCtx() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }
      function playTone(freq, type, duration, vol = 0.3, when = 0) {
        if (!audioEnabled) return;
        const ctx2 = getAudioCtx();
        const t = ctx2.currentTime + when;
        const osc = ctx2.createOscillator();
        const g = ctx2.createGain();
        osc.connect(g);
        g.connect(ctx2.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.start(t);
        osc.stop(t + duration);
      }
      function sfxJump() {
        if (!audioEnabled) return;
        const ctx2 = getAudioCtx();
        const t = ctx2.currentTime;
        const osc = ctx2.createOscillator();
        const g = ctx2.createGain();
        osc.connect(g);
        g.connect(ctx2.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(720, t + 0.12);
        g.gain.setValueAtTime(0.35, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.2);
      }
      function sfxPoint() {
        if (!audioEnabled) return;
        [0, 0.07, 0.14].forEach((w, i) => {
          playTone([880, 1100, 1320][i], "triangle", 0.18, 0.22, w);
        });
      }
      function sfxGameOver() {
        if (!audioEnabled) return;
        stopBgMusic();
        [
          [600, 0],
          [480, 0.12],
          [360, 0.24],
          [240, 0.38],
          [150, 0.54],
        ].forEach(([f, w]) => playTone(f, "sawtooth", 0.18, 0.28, w));
        setTimeout(() => playTone(80, "sine", 0.5, 0.5), 600);
      }
      function sfxCoin() {
        if (!audioEnabled) return;
        const ctx2 = getAudioCtx();
        const t = ctx2.currentTime;
        [1400, 1800].forEach((freq, i) => {
          const osc = ctx2.createOscillator();
          const g = ctx2.createGain();
          osc.connect(g);
          g.connect(ctx2.destination);
          osc.type = "sine";
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0.18, t + i * 0.04);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.18 + i * 0.04);
          osc.start(t + i * 0.04);
          osc.stop(t + 0.22 + i * 0.04);
        });
      }
      function stopBgMusic() {
        bgNodes.forEach((n) => {
          try {
            n.stop();
          } catch (e) {}
        });
        bgNodes = [];
        bgStarted = false;
      }
      function startBgMusic() {
        if (!audioEnabled || bgStarted) return;
        bgStarted = true;
        const ctx2 = getAudioCtx();
        const bgGain = ctx2.createGain();
        bgGain.gain.value = 0.08;
        bgGain.connect(ctx2.destination);
        const bpm = 84,
          beat = 60 / bpm;
        const melody = [
          [1047, 1],
          [1175, 1],
          [1319, 1],
          [1047, 1],
          [1319, 1],
          [1568, 2],
          [1047, 1],
          [1319, 1],
          [1175, 1],
          [1047, 1],
          [880, 2],
          [880, 1],
          [784, 1],
          [1047, 1],
          [1319, 1],
          [1568, 1],
          [1319, 1],
          [1047, 2],
          [784, 1],
          [880, 1],
          [1047, 1],
          [880, 1],
          [784, 1],
          [659, 1],
          [523, 4],
        ];
        const bass = [261, 196, 261, 196, 261, 220, 196, 261];
        function bell(freq, t, dur) {
          const osc = ctx2.createOscillator();
          const g = ctx2.createGain();
          osc.connect(g);
          g.connect(bgGain);
          osc.type = "sine";
          osc.frequency.value = freq;
          const d = Math.min(dur * beat * 0.9, 1.6);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.9, t + 0.008);
          g.gain.exponentialRampToValueAtTime(0.001, t + d);
          osc.start(t);
          osc.stop(t + d + 0.02);
          bgNodes.push(osc);
          const osc2 = ctx2.createOscillator();
          const g2 = ctx2.createGain();
          osc2.connect(g2);
          g2.connect(bgGain);
          osc2.type = "sine";
          osc2.frequency.value = freq * 3;
          g2.gain.setValueAtTime(0, t);
          g2.gain.linearRampToValueAtTime(0.1, t + 0.008);
          g2.gain.exponentialRampToValueAtTime(0.001, t + d * 0.4);
          osc2.start(t);
          osc2.stop(t + d * 0.45);
          bgNodes.push(osc2);
        }
        function schedMelody(st) {
          let t = st;
          melody.forEach(([f, d]) => {
            bell(f, t, d);
            t += d * beat;
          });
          return t;
        }
        function schedBass(st) {
          let t = st;
          bass.forEach((f) => {
            const osc = ctx2.createOscillator();
            const g = ctx2.createGain();
            osc.connect(g);
            g.connect(bgGain);
            osc.type = "triangle";
            osc.frequency.value = f;
            const d = 4 * beat;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.25, t + 0.3);
            g.gain.linearRampToValueAtTime(0, t + d);
            osc.start(t);
            osc.stop(t + d);
            bgNodes.push(osc);
            t += d;
          });
        }
        const melDur = melody.reduce((s, [, d]) => s + d * beat, 0);
        function loop2(st) {
          if (!bgStarted) return;
          schedMelody(st);
          schedBass(st);
          setTimeout(
            () => {
              if (bgStarted) loop2(ctx2.currentTime + 0.08);
            },
            (melDur - 0.5) * 1000,
          );
        }
        loop2(ctx2.currentTime + 0.05);
      }

      // Exemplo de como aplicar dentro da lógica que computa os pontos:
function checkScore(pipe) {
  if (!pipe.passed && pipe.x + PIPE_W < bird.x) {
    pipe.passed = true;
    score++;
    
    // --- SISTEMA DE DIFICULDADE PROGRESSIVA ---
    // A cada 5 pontos, o jogo acelera e o vão diminui!
    if (score % 5 === 0) {
      if (speed < 6) speed += 0.3; // Aumenta a velocidade (teto máximo de 6)
