<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Rhino</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --orange:#FF6B1A;--orange2:#FF8C42;--yellow:#FFD700;--yellow2:#F5A800;
  --purple:#5B2D8E;--purple2:#7C3FBF;--purple3:#C47FDB;--lilac:#C8A8E8;
  --outline:#3B1A60;--white:#FFF8F0;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#1a0a30;}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#FF8C42 0%,#FF6B1A 40%,#C73D00 70%,#3B1A60 100%);}
#bg-sun{position:absolute;top:50%;left:50%;width:200vmax;height:200vmax;transform:translate(-50%,-50%);
  background:conic-gradient(#FFD700 0deg,#FF8C42 10deg,#FFD700 20deg,#FF8C42 30deg,#FFD700 40deg,#FF8C42 50deg,#FFD700 60deg,#FF8C42 70deg,#FFD700 80deg,#FF8C42 90deg,#FFD700 100deg,#FF8C42 110deg,#FFD700 120deg,#FF8C42 130deg,#FFD700 140deg,#FF8C42 150deg,#FFD700 160deg,#FF8C42 170deg,#FFD700 180deg,#FF8C42 190deg,#FFD700 200deg,#FF8C42 210deg,#FFD700 220deg,#FF8C42 230deg,#FFD700 240deg,#FF8C42 250deg,#FFD700 260deg,#FF8C42 270deg,#FFD700 280deg,#FF8C42 290deg,#FFD700 300deg,#FF8C42 310deg,#FFD700 320deg,#FF8C42 330deg,#FFD700 340deg,#FF8C42 350deg,#FFD700 360deg);
  opacity:.22;animation:spinSun 22s linear infinite;}
@keyframes spinSun{to{transform:translate(-50%,-50%) rotate(360deg)}}
#bg-overlay{position:absolute;inset:0;background:rgba(59,26,96,.55);}
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;transition:opacity .45s,transform .45s;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.94);}

/* LOGIN */
#loginScreen{flex-direction:column;}
.login-card{position:relative;background:var(--white);border:5px solid var(--outline);border-radius:28px;padding:28px 40px 36px;width:320px;box-shadow:7px 9px 0 var(--outline);animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both;display:flex;flex-direction:column;align-items:center;}
@keyframes popIn{from{opacity:0;transform:scale(.7) rotate(-3deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,var(--orange) 0,var(--orange) 20px,var(--yellow) 20px,var(--yellow) 40px);border-radius:22px 22px 0 0;}
.logo-img{width:220px;margin:4px 0 20px;filter:drop-shadow(3px 4px 0 var(--outline));animation:rhinoBob 2s ease-in-out infinite;}
@keyframes rhinoBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.btn-play{width:100%;padding:14px;background:var(--yellow);border:3px solid var(--outline);border-radius:14px;font-family:'Lilita One',cursive;font-size:22px;color:var(--outline);cursor:pointer;box-shadow:4px 5px 0 var(--outline);transition:transform .1s,box-shadow .1s;letter-spacing:.5px;}
.btn-play:hover{background:#ffe84d;transform:translate(-1px,-1px);box-shadow:5px 6px 0 var(--outline);}
.btn-play:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--outline);}

/* NAME MODAL (shown after game over) */
#nameModal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(30,10,60,.75);backdrop-filter:blur(4px);transition:opacity .3s;}
#nameModal.hidden{opacity:0;pointer-events:none;}
.name-card{background:var(--white);border:5px solid var(--outline);border-radius:24px;padding:28px 36px 30px;width:320px;text-align:center;box-shadow:7px 9px 0 var(--outline);animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;display:flex;flex-direction:column;align-items:center;gap:12px;}
.name-card::before{content:'';position:absolute;top:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,var(--orange) 0,var(--orange) 20px,var(--yellow) 20px,var(--yellow) 40px);border-radius:18px 18px 0 0;}
.name-card{position:relative;}
.name-title{font-family:'Lilita One',cursive;font-size:22px;color:var(--orange);-webkit-text-stroke:1.5px var(--outline);text-shadow:2px 2px 0 var(--outline);}
.name-score-display{font-family:'Lilita One',cursive;font-size:32px;color:var(--purple2);-webkit-text-stroke:1.5px var(--outline);text-shadow:2px 2px 0 var(--outline);}
.name-sub{font-size:13px;font-weight:800;color:#888;}
.name-input{width:100%;background:#fff;border:3px solid var(--outline);border-radius:12px;padding:11px 14px;font-size:16px;font-family:'Nunito',sans-serif;font-weight:800;color:var(--outline);outline:none;box-shadow:3px 3px 0 var(--outline);transition:border-color .2s;}
.name-input:focus{border-color:var(--orange);box-shadow:3px 3px 0 var(--orange2);}
.name-input::placeholder{color:#ccc;font-weight:700;}
.name-error{font-size:13px;font-weight:900;color:#d63030;display:none;}
.name-error.show{display:block;}
.btn-save-name{width:100%;padding:13px;background:var(--yellow);border:3px solid var(--outline);border-radius:12px;font-family:'Lilita One',cursive;font-size:19px;color:var(--outline);cursor:pointer;box-shadow:4px 5px 0 var(--outline);transition:transform .1s,box-shadow .1s;}
.btn-save-name:hover{background:#ffe84d;transform:translate(-1px,-1px);box-shadow:5px 6px 0 var(--outline);}
.btn-save-name:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--outline);}

/* GAME */
#gameScreen{flex-direction:column;align-items:center;gap:8px;}
#topBar{display:flex;align-items:center;justify-content:space-between;width:420px;background:var(--white);border:3px solid var(--outline);border-radius:14px;padding:7px 14px;box-shadow:4px 4px 0 var(--outline);}
#scoreDisplay{font-family:'Lilita One',cursive;font-size:26px;color:var(--orange);-webkit-text-stroke:1.5px var(--outline);text-shadow:2px 2px 0 var(--outline);}
#bestDisplay{font-size:11px;font-weight:900;color:var(--purple2);}
#gameCanvas{border-radius:14px;border:4px solid var(--outline);box-shadow:6px 8px 0 var(--outline);display:block;cursor:pointer;}
#hint{font-size:12px;font-weight:900;color:var(--white);opacity:.7;}
#logoutBtn{background:var(--purple2);border:2px solid var(--outline);border-radius:8px;color:#fff;font-family:'Nunito',sans-serif;font-size:11px;font-weight:900;padding:4px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--outline);transition:transform .1s,box-shadow .1s;}
#logoutBtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--outline);}

/* RANKING */
#rankingScreen{flex-direction:column;align-items:center;}
.rank-card{position:relative;background:var(--white);border:5px solid var(--outline);border-radius:28px;padding:28px 36px 32px;width:360px;box-shadow:7px 9px 0 var(--outline);animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;}
.rank-card::before{content:'';position:absolute;top:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,var(--yellow) 0,var(--yellow) 20px,var(--orange) 20px,var(--orange) 40px);border-radius:22px 22px 0 0;}
.rank-title{font-family:'Lilita One',cursive;font-size:30px;text-align:center;color:var(--orange);-webkit-text-stroke:2px var(--outline);text-shadow:3px 3px 0 var(--outline);margin-bottom:20px;margin-top:4px;}
.rank-list{list-style:none;width:100%;margin-bottom:20px;}
.rank-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:8px;background:#fff;border:3px solid var(--outline);border-radius:12px;box-shadow:2px 3px 0 var(--outline);font-family:'Lilita One',cursive;font-size:15px;color:var(--outline);}
.rank-list li:first-child{background:var(--yellow);font-size:17px;}
.rank-list li:nth-child(2){background:#e8e8e8;}
.rank-list li:nth-child(3){background:#f4c98a;}
.rank-pos{font-size:20px;width:28px;text-align:center;}
.rank-pname{flex:1;}
.rank-pts{color:var(--purple2);font-size:14px;}
.rank-btns{display:flex;gap:10px;width:100%;}
.btn-rank{flex:1;padding:12px;background:var(--yellow);border:3px solid var(--outline);border-radius:12px;font-family:'Lilita One',cursive;font-size:17px;color:var(--outline);cursor:pointer;box-shadow:3px 4px 0 var(--outline);transition:transform .1s,box-shadow .1s;}
.btn-rank:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--outline);}
.btn-rank:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--outline);}
.btn-rank.purple{background:var(--purple2);color:#fff;}

/* SHARE MODAL */
#shareModal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(30,10,60,.72);backdrop-filter:blur(4px);transition:opacity .3s;}
#shareModal.hidden{opacity:0;pointer-events:none;}
.share-card{background:var(--white);border:5px solid var(--outline);border-radius:24px;padding:28px 36px 30px;width:310px;text-align:center;box-shadow:7px 9px 0 var(--outline);animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
.share-title{font-family:'Lilita One',cursive;font-size:24px;color:var(--orange);-webkit-text-stroke:1.5px var(--outline);text-shadow:2px 2px 0 var(--outline);margin-bottom:4px;}
.share-score{font-family:'Lilita One',cursive;font-size:17px;color:var(--purple2);margin-bottom:18px;}
.share-btns{display:flex;flex-direction:column;gap:10px;}
.btn-share{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 18px;border:3px solid var(--outline);border-radius:12px;font-family:'Lilita One',cursive;font-size:17px;cursor:pointer;box-shadow:3px 4px 0 var(--outline);transition:transform .1s,box-shadow .1s;color:#fff;}
.btn-share:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--outline);}
.btn-share:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--outline);}
.btn-wpp{background:#25D366;}.btn-ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}.btn-tt{background:#010101;}.btn-close-share{background:#888;}
.share-icon{font-size:20px;}

#muteBtn{background:var(--yellow);border:2.5px solid var(--outline);border-radius:8px;font-size:16px;width:34px;height:34px;cursor:pointer;box-shadow:2px 2px 0 var(--outline);transition:transform .1s,box-shadow .1s;display:flex;align-items:center;justify-content:center;padding:0;}
#muteBtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--outline);}
#muteBtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--outline);}
</style>
</head>
<body>
<div id="bg"><div id="bg-sun"></div><div id="bg-overlay"></div></div>

<!-- LOGIN -->
<div class="screen" id="loginScreen">
  <div class="login-card">
    <img id="logoImg" class="logo-img" alt="Flappy Rhino">
    <button class="btn-play" id="loginBtn">🚀 Jogar!</button>
  </div>
</div>

<!-- NAME MODAL (after game over) -->
<div id="nameModal" class="hidden">
  <div class="name-card">
    <div class="name-title">🎮 Game Over!</div>
    <div class="name-score-display" id="nameModalScore">0 pts</div>
    <p class="name-sub">Coloque seu nome no ranking!</p>
    <input type="text" class="name-input" id="nameInput" placeholder="Seu apelido" maxlength="16" autocomplete="off">
    <div class="name-error" id="nameError">Ei! Preciso do seu nome! 👀</div>
    <button class="btn-save-name" id="btnSaveName">✅ Salvar no Ranking</button>
  </div>
</div>

<!-- GAME -->
<div class="screen hidden" id="gameScreen">
  <div id="topBar"><button id="muteBtn" title="Mudo/Som">🔊</button>
    <div id="scoreDisplay">0</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div id="bestDisplay">🏆 Melhor: 0</div>
      <button id="logoutBtn">Sair</button>
    </div>
  </div>
  <canvas id="gameCanvas" width="420" height="520"></canvas>
  <p id="hint">Espaço ou clique para pular!</p>
</div>

<!-- RANKING -->
<div class="screen hidden" id="rankingScreen">
  <div class="rank-card">
    <h2 class="rank-title">🏆 Ranking</h2>
    <ul class="rank-list" id="rankList"></ul>
    <div class="rank-btns">
      <button class="btn-rank purple" id="btnBackToGame">▶ Jogar</button>
      <button class="btn-rank" id="btnShare2">📤 Compartilhar</button>
    </div>
  </div>
</div>

<!-- SHARE MODAL -->
<div id="shareModal" class="hidden">
  <div class="share-card">
    <div class="share-title">📤 Compartilhar!</div>
    <div class="share-score" id="shareScoreText"></div>
    <div class="share-btns">
      <button class="btn-share btn-wpp" id="btnWpp"><span class="share-icon">💬</span> WhatsApp</button>
      <button class="btn-share btn-ig" id="btnIg"><span class="share-icon">📸</span> Instagram</button>
      <button class="btn-share btn-tt" id="btnTt"><span class="share-icon">🎵</span> TikTok</button>
      <button class="btn-share btn-close-share" id="btnCloseShare">✕ Fechar</button>
    </div>
  </div>
</div>

// RANKING
function getRanking(){try{return JSON.parse(localStorage.getItem('flappy_ranking')||'[]');}catch{return[];}}
function saveRanking(r){localStorage.setItem('flappy_ranking',JSON.stringify(r));}
function addScore(name,pts){const r=getRanking();r.push({name,pts});r.sort((a,b)=>b.pts-a.pts);saveRanking(r.slice(0,10));}
function renderRanking(){
  const r=getRanking();const ul=document.getElementById('rankList');
  const medals=['🥇','🥈','🥉'];
  if(!r.length){ul.innerHTML='<li style="justify-content:center;font-family:Nunito;font-size:14px;color:#aaa">Nenhuma pontuação ainda!</li>';return;}
  ul.innerHTML=r.slice(0,8).map((e,i)=>`<li><span class="rank-pos">${medals[i]||'#'+(i+1)}</span><span class="rank-pname">${e.name}</span><span class="rank-pts">${e.pts} pts</span></li>`).join('');
}

// SHARE
let lastScore=0,currentPlayer='Jogador';
function openShare(score,name){
  const text=encodeURIComponent('Fiz '+score+' pontos no Flappy Rhino! 🦏⚡ Consegue superar? https://jogorhino.vercel.app/');
  document.getElementById('shareScoreText').textContent=name+': '+score+' pts 🎉';
  document.getElementById('btnWpp').onclick=()=>window.open('https://wa.me/?text='+text,'_blank');
  document.getElementById('btnIg').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(text));alert('Texto copiado! Cole na legenda do Instagram 📸');};
  document.getElementById('btnTt').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(text));alert('Texto copiado! Cole na descrição do TikTok 🎵');};
  document.getElementById('shareModal').classList.remove('hidden');
}
document.getElementById('btnCloseShare').addEventListener('click',()=>document.getElementById('shareModal').classList.add('hidden'));
document.getElementById('btnShare2').addEventListener('click',()=>openShare(lastScore,currentPlayer));

// NAME MODAL (after game over)
const nameModal   = document.getElementById('nameModal');
const nameInput   = document.getElementById('nameInput');
const nameError   = document.getElementById('nameError');
const nameModalScore = document.getElementById('nameModalScore');

function openNameModal(pts){
  nameModalScore.textContent = pts + ' pts';
  nameInput.value = '';
  nameError.classList.remove('show');
  nameModal.classList.remove('hidden');
  setTimeout(()=>nameInput.focus(), 100);
}
function submitName(){
  const n = nameInput.value.trim();
  if(!n){nameError.classList.add('show');nameInput.focus();return;}
  nameError.classList.remove('show');
  currentPlayer = n;
  addScore(n, lastScore);
  nameModal.classList.add('hidden');
  renderRanking();
  showScreen(rankingScreen);
}
document.getElementById('btnSaveName').addEventListener('click', submitName);
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitName(); });

// GAME
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('scoreDisplay');
const bestEl=document.getElementById('bestDisplay');
const W=canvas.width,H=canvas.height,GROUND=H-55;
const GRAVITY=0.36,JUMP=-7.2,PIPE_W=54,GAP=168,PIPE_SPEED=2.2,PIPE_INTERVAL=2000;
let state='idle',bird,pipes,score,lastPipe;
function initBird(){return{x:88,y:H/2-20,vy:0,w:62,h:52};}
function reset(){bird=initBird();pipes=[];score=0;lastPipe=0;scoreEl.textContent='0';}
function spawnPipe(){const topH=Math.floor(Math.random()*(GROUND-GAP-120))+60;pipes.push({x:W+10,topH,scored:false});}
function jump(){if(state==='dead')return;if(state==='idle'){state='playing';lastPipe=performance.now();startBgMusic();}bird.vy=JUMP;sfxJump();}

function drawBg(){
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#7B3BAF');sky.addColorStop(.5,'#C06AD0');sky.addColorStop(1,'#F5B8FF');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  ctx.save();ctx.translate(W/2,GROUND);ctx.globalAlpha=0.1;
  for(let i=0;i<18;i++){ctx.fillStyle=i%2===0?'#FFD700':'#fff';ctx.beginPath();ctx.moveTo(0,0);const a1=(i*20-90)*Math.PI/180,a2=((i+1)*20-90)*Math.PI/180;ctx.arc(0,0,700,a1,a2);ctx.closePath();ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.8)';[[0,0,s],[s*.7,-s*.4,s*.8],[s*1.4,0,s*.9],[-s*.4,s*.1,s*.7]].forEach(([ox,oy,r])=>{ctx.beginPath();ctx.arc(x+ox,y+oy,r,0,Math.PI*2);ctx.fill();});}
  cloud(40,55,20);cloud(150,38,17);cloud(270,62,22);cloud(370,44,19);
  ctx.fillStyle='#7EC850';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#5FAD35';for(let x=0;x<W;x+=20){ctx.beginPath();ctx.arc(x+10,GROUND,10,Math.PI,0);ctx.fill();}
  ctx.fillStyle='#A8E06B';ctx.fillRect(0,GROUND,W,5);
}

function drawPipes(){
  pipes.forEach(p=>{
    const gr=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    gr.addColorStop(0,'#FF6B1A');gr.addColorStop(.4,'#FF8C42');gr.addColorStop(1,'#E05010');
    ctx.fillStyle=gr;ctx.beginPath();ctx.roundRect(p.x+2,0,PIPE_W-4,p.topH-12,[0,0,4,4]);ctx.fill();
    ctx.strokeStyle='#3B1A60';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(p.x+2,0,PIPE_W-4,p.topH-12,[0,0,4,4]);ctx.stroke();
    ctx.fillStyle='#FF6B1A';ctx.beginPath();ctx.roundRect(p.x-5,p.topH-28,PIPE_W+10,28,8);ctx.fill();
    ctx.strokeStyle='#3B1A60';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(p.x-5,p.topH-28,PIPE_W+10,28,8);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.roundRect(p.x+6,4,9,p.topH-34,[4,4,0,0]);ctx.fill();
    const botY=p.topH+GAP;
    ctx.fillStyle=gr;ctx.beginPath();ctx.roundRect(p.x+2,botY+28,PIPE_W-4,GROUND-botY-28,[4,4,0,0]);ctx.fill();
    ctx.strokeStyle='#3B1A60';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(p.x+2,botY+28,PIPE_W-4,GROUND-botY-28,[4,4,0,0]);ctx.stroke();
    ctx.fillStyle='#FF6B1A';ctx.beginPath();ctx.roundRect(p.x-5,botY,PIPE_W+10,28,8);ctx.fill();
    ctx.strokeStyle='#3B1A60';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(p.x-5,botY,PIPE_W+10,28,8);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.roundRect(p.x+6,botY+30,9,GROUND-botY-55,[4,4,0,0]);ctx.fill();
  });
}
function drawBird(){
  const b = bird;
  // Usamos o bird.size do seu jogo original como largura e altura
  const largura = b.size || b.w || 50; 
  const altura = b.size || b.h || 50;

  ctx.save();
  // Centraliza o ponto de rotação no meio do pássaro
  ctx.translate(b.x + largura / 2, b.y + altura / 2);
  
  // Faz a inclinação do pulo/queda
  const angle = Math.max(-0.5, Math.min(0.6, b.vy * 0.07));
  ctx.rotate(angle);
  
  // Desenha a imagem se ela tiver carregada
  if(rhinoImg.complete && rhinoImg.naturalWidth > 0){
    ctx.drawImage(rhinoImg, -largura / 2, -altura / 2, largura, altura);
  } else {
    // Caso a imagem falhe, desenha o círculo roxo para o jogo não quebrar
    ctx.fillStyle = '#9B4DB8';
    ctx.beginPath();
    ctx.arc(0, 0, largura / 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function ctext(txt,x,y,sz,fill,stroke,sw=4){ctx.font=sz+'px Lilita One, cursive';ctx.textAlign='center';ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.strokeText(txt,x,y);ctx.fillStyle=fill;ctx.fillText(txt,x,y);}

function oBtn(label,bx,by,bw,bh,bg,tc){
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
  ctx.strokeStyle='#3B1A60';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.stroke();
  ctext(label,bx+bw/2,by+bh*.64,14,tc||'#fff','#3B1A60',2);
}

function drawOverlay(){
  ctx.fillStyle='rgba(40,10,70,.55)';ctx.fillRect(0,0,W,H);
  if(state==='idle'){
    ctext('Pronto para voar?',W/2,H/2-55,26,'#FFD700','#3B1A60');
    ctx.font='800 14px Nunito,sans-serif';ctx.fillStyle='rgba(255,255,255,.85)';ctx.textAlign='center';
    ctx.fillText('Pressione Espaço ou clique!',W/2,H/2-18);
  }
  if(state==='dead'){
    ctext('Game Over!',W/2,H/2-108,38,'#FFD700','#3B1A60',5);
    ctext(''+score+' pts',W/2,H/2-60,28,'#fff','#3B1A60',4);
    if(score>=best&&score>0) ctext('🏆 Novo recorde!',W/2,H/2-24,16,'#7BF27B','#3B1A60',3);
    ctx.font='800 13px Nunito,sans-serif';ctx.fillStyle='rgba(255,255,255,.6)';ctx.textAlign='center';
    ctx.fillText('Melhor: '+best,W/2,H/2);
    oBtn('🔄 Jogar',W/2-108,H/2+18,98,40,'#FF6B1A');
    oBtn('🏆 Ranking',W/2+10,H/2+18,98,40,'#7C3FBF');
    oBtn('📤 Compartilhar',W/2-88,H/2+70,176,40,'#FFD700','#3B1A60');
  }
}

function checkCollision(){
  const b=bird,m=5;
  const bx1=b.x+m,bx2=b.x+b.w-m,by1=b.y+m,by2=b.y+b.h-m;
  if(by2>=GROUND||by1<=0) return true;
  for(const p of pipes){if(bx2>p.x-2&&bx1<p.x+PIPE_W+2){if(by1<p.topH||by2>p.topH+GAP) return true;}}
  return false;
}

function loop(now){
  rafId=requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);drawBg();
  if(state==='playing'){
    bird.vy+=GRAVITY;bird.y+=bird.vy;
    if(now-lastPipe>PIPE_INTERVAL){spawnPipe();lastPipe=now;}
    pipes.forEach(p=>{p.x-=PIPE_SPEED;});
    pipes=pipes.filter(p=>p.x+PIPE_W>-20);
    pipes.forEach(p=>{if(!p.scored&&p.x+PIPE_W<bird.x){p.scored=true;score++;if(score>best)best=score;scoreEl.textContent=score;bestEl.textContent='🏆 Melhor: '+best;sfxPoint();}});
    if(checkCollision()){state='dead';lastScore=score;sfxGameOver();openNameModal(score);}
  }
  drawPipes();drawBird();
  if(state==='idle'||state==='dead') drawOverlay();
}

canvas.addEventListener('click',e=>{
  if(state==='dead'){
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(W/r.width);
    const my=(e.clientY-r.top)*(H/r.height);
    if(mx>=W/2-108&&mx<=W/2-10&&my>=H/2+18&&my<=H/2+58){reset();state='playing';lastPipe=performance.now();bird.vy=JUMP;return;}
    if(mx>=W/2+10&&mx<=W/2+108&&my>=H/2+18&&my<=H/2+58){cancelAnimationFrame(rafId);rafId=null;renderRanking();showScreen(rankingScreen);return;}
    if(mx>=W/2-88&&mx<=W/2+88&&my>=H/2+70&&my<=H/2+110){openShare(lastScore,currentPlayer);return;}
    return;
  }
  jump();
});
document.addEventListener('keydown',e=>{
  if(gameScreen.classList.contains('hidden')) return;
  if(e.code==='Space'){e.preventDefault();jump();}
  if(e.code==='KeyR'&&state==='dead'){reset();state='idle';}
});


// ══════════════════════════════
// AUDIO ENGINE (Web Audio API)
// ══════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let bgNodes = [];
let audioEnabled = true;
let bgStarted = false;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ── MUTE BUTTON ──
const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  audioEnabled = !audioEnabled;
  muteBtn.textContent = audioEnabled ? '🔊' : '🔇';
  if (!audioEnabled) stopBgMusic();
  else if (state === 'playing') startBgMusic();
});

// ── SFX HELPERS ──
function playTone(freq, type, duration, vol=0.3, when=0) {
  if (!audioEnabled) return;
  const ctx = getAudioCtx();
  const t = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.start(t); osc.stop(t + duration);
}

function playNoise(duration, vol=0.15, freq=800) {
  if (!audioEnabled) return;
  const ctx = getAudioCtx();
  const buf = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
  const src = ctx.createBufferSource();
  const filt = ctx.createBiquadFilter();
  const gain = ctx.createGain();
  src.buffer = buf;
  filt.type = 'bandpass'; filt.frequency.value = freq;
  src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  src.start(); src.stop(ctx.currentTime + duration);
}

// ── JUMP SFX ── (cartoon "boing" - swoosh up)
function sfxJump() {
  if (!audioEnabled) return;
  const ctx = getAudioCtx();
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300, t);
  osc.frequency.exponentialRampToValueAtTime(720, t + 0.12);
  gain.gain.setValueAtTime(0.35, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  osc.start(t); osc.stop(t + 0.2);
  // little snap
  playNoise(0.04, 0.08, 1200);
}

// ── POINT SFX ── (cheerful ding-ding)
function sfxPoint() {
  if (!audioEnabled) return;
  [0, 0.07, 0.14].forEach((w, i) => {
    const freqs = [880, 1100, 1320];
    playTone(freqs[i], 'triangle', 0.18, 0.22, w);
  });
}

// ── GAME OVER SFX ── (dramatic descending + noise crash)
function sfxGameOver() {
  if (!audioEnabled) return;
  const ctx = getAudioCtx();
  stopBgMusic();
  // descending wail
  [[600,0],[480,0.12],[360,0.24],[240,0.38],[150,0.54]].forEach(([f,w])=>{
    playTone(f,'sawtooth',0.18,0.28,w);
  });
  // crash noise
  setTimeout(()=>playNoise(0.6,0.4,200), 650);
  // low thud
  setTimeout(()=>{
    playTone(80,'sine',0.5,0.5);
    playTone(60,'sine',0.6,0.4);
  }, 600);
}

// ══════════════════════════════
// BACKGROUND MUSIC
// Gentle infantile glockenspiel loop
// ══════════════════════════════
let bgGain = null;

function stopBgMusic() {
  bgNodes.forEach(n => { try { n.stop(); } catch(e){} });
  bgNodes = [];
  bgStarted = false;
}

function startBgMusic() {
  if (!audioEnabled || bgStarted) return;
  bgStarted = true;
  const ctx = getAudioCtx();

  bgGain = ctx.createGain();
  bgGain.gain.value = 0.09; // bem baixinho
  bgGain.connect(ctx.destination);

  const bpm  = 112;           // tempo calmo
  const beat = 60 / bpm;

  // Glockenspiel: notas suaves C5 pentatônica + oitava abaixo
  // padrão simples: melodia de 8 compassos, muito espaçada
  const melody = [
    // compasso 1 - frase de abertura
    [523,1],[659,1],[784,1],[0,1],
    // compasso 2
    [880,1.5],[784,0.5],[659,1],
    // compasso 3 - descanso
    [523,1],[0,1],[523,0.5],[659,0.5],[523,1],
    // compasso 4
    [784,1],[659,1],[523,2],
    // compasso 5 - subida suave
    [659,1],[784,1],[880,1],[0,1],
    // compasso 6
    [1047,1.5],[880,0.5],[784,1],
    // compasso 7 - descida gentil
    [659,1],[523,1],[440,1],[0,1],
    // compasso 8 - resolve
    [523,1],[659,0.5],[523,0.5],[392,1],[523,1],
  ];

  // Baixo harmonioso bem suave: só raiz do acorde a cada 2 tempos
  const bass = [
    [131,2],[165,2],
    [131,2],[196,2],
    [131,2],[165,2],
    [131,2],[131,2],
  ];

  function glockNote(freq, startT, dur) {
    if (freq === 0) return; // silêncio
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    // Dois parciais para timbre de glockenspiel
    const osc2  = ctx.createOscillator();
    const gain2 = ctx.createGain();

    osc.connect(gain);   gain.connect(bgGain);
    osc2.connect(gain2); gain2.connect(bgGain);

    osc.type  = 'sine';
    osc2.type = 'sine';
    osc.frequency.value  = freq;
    osc2.frequency.value = freq * 2.756; // parcial inarmônico típico de glock

    const d = dur * beat;
    // ataque instantâneo, decaimento natural longo
    gain.gain.setValueAtTime(0, startT);
    gain.gain.linearRampToValueAtTime(0.9, startT + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, startT + Math.min(d * 1.8, 1.6));

    gain2.gain.setValueAtTime(0, startT);
    gain2.gain.linearRampToValueAtTime(0.35, startT + 0.008);
    gain2.gain.exponentialRampToValueAtTime(0.001, startT + Math.min(d * 0.8, 0.6));

    osc.start(startT);  osc.stop(startT + Math.min(d * 1.8, 1.6) + 0.05);
    osc2.start(startT); osc2.stop(startT + Math.min(d * 0.8, 0.6) + 0.05);
    bgNodes.push(osc, osc2);
  }

  function scheduleMelody(startTime) {
    let t = startTime;
    melody.forEach(([freq, dur]) => {
      glockNote(freq, t, dur);
      t += dur * beat;
    });
    return t;
  }

  function scheduleBass(startTime) {
    let t = startTime;
    bass.forEach(([freq, dur]) => {
      if (freq > 0) {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(bgGain);
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const d = dur * beat;
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + d * 0.85);
        osc.start(t); osc.stop(t + d);
        bgNodes.push(osc);
      }
      t += dur * beat;
    });
  }

  // Triângulo percussivo bem suave a cada 2 tempos
  function scheduleTriangle(startTime, totalBeats) {
    for (let i = 0; i < totalBeats; i += 2) {
      const t = startTime + i * beat;
      const buf  = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let j = 0; j < data.length; j++) data[j] = Math.random() * 2 - 1;
      const src  = ctx.createBufferSource();
      const filt = ctx.createBiquadFilter();
      const g    = ctx.createGain();
      src.buffer = buf;
      filt.type  = 'bandpass'; filt.frequency.value = 4000; filt.Q.value = 8;
      src.connect(filt); filt.connect(g); g.connect(bgGain);
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      src.start(t); src.stop(t + 0.05);
      bgNodes.push(src);
    }
  }

  const melodyDur = melody.reduce((s, [, d]) => s + d * beat, 0);

  function scheduleLoop(startTime) {
    if (!bgStarted) return;
    scheduleMelody(startTime);
    scheduleBass(startTime);
    scheduleTriangle(startTime, Math.round(melodyDur / beat));
    setTimeout(() => {
      if (bgStarted) scheduleLoop(ctx.currentTime + 0.1);
    }, (melodyDur - 0.4) * 1000);
  }

  scheduleLoop(ctx.currentTime + 0.05);
}
